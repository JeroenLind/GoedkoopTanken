name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Controleer dat de tag bij config.yaml past
        run: |
          pip install pyyaml
          python scripts/check_addon.py --tag "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Naam van het image (kleine letters)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/goedkoop-tanken" >> "$GITHUB_OUTPUT"
      - name: Versie zonder v (Home Assistant vraagt het image op met de versie uit config.yaml, dus zonder v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Bouw en publiceer (multi-arch manifest)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: goedkoop-tanken/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            BUILD_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}   # versies 0.x.y zijn testversies
